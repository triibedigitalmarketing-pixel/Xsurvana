  color: rgb(148 163 184 / var(--tw-text-opacity, 1));
}

.text-slate-950{
  --tw-text-opacity: 1;
  color: rgb(2 6 23 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.opacity-70{
  opacity: 0.7;
}

.shadow-\[0_18px_40px_rgba\(0\2c 0\2c 0\2c 0\.25\)\]{
  --tw-shadow: 0 18px 40px rgba(0,0,0,0.25);
  --tw-shadow-colored: 0 18px 40px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.outline-none{
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.blur{
  --tw-blur: blur(8px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-transform{
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#0f172a;
  --surface:#1e293b;
  --surface-2:#16233a;
  --gold:#D4AF37;
  --gold-soft:#f3e2a3;
  --text:#ffffff;
  --muted:#cbd5e1;
  --line:#334155;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg);
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Manrope",system-ui,sans-serif
}

.font-display{
  font-family:"Fraunces",Georgia,serif
}

.gold-line{
  background:linear-gradient(90deg,var(--gold),transparent)
}

.chip-active{
  background:var(--gold)!important;
  color:#111827!important;
  border-color:var(--gold)!important
}

details summary::-webkit-details-marker{
  display:none
}

.placeholder\:text-slate-400::-moz-placeholder{
  --tw-text-opacity: 1;
  color: rgb(148 163 184 / var(--tw-text-opacity, 1));
}

.placeholder\:text-slate-400::placeholder{
  --tw-text-opacity: 1;
  color: rgb(148 163 184 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-\[1fr_auto\]{
    grid-template-columns: 1fr auto;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-\[72px\]{
    font-size: 72px;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-\[1\.35fr_0\.65fr\]{
    grid-template-columns: 1.35fr 0.65fr;
  }

  .lg\:flex-row{
    flex-direction: row;
  }

  .lg\:items-center{
    align-items: center;
  }

  .lg\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }
}

@media (min-width: 1280px){
  .xl\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

ap hari.”",footage:"Sofia di depan Site Plan Batch I, pegang kalkulator dan brosur. Kamera medium, lalu close-up hitungan di kalkulator.",location:"Depan Site Plan Batch I",talent:"Sofia — hijab, baju maroon",props:"Kalkulator • Brosur • Site Plan",script:["0–3 dtk: “Mba, gaji 4 juta bisa KPR gak? Aku ditanya ini tiap hari.”","3–10 dtk: “Jujur bae ya, akeh sing gaji UMR Purwokerto wis akad nang kene. Sing penting riwayat bayare rapi.”","10–20 dtk: Tunjuk kalkulator. “Angsurane flat 1 jutaan, dadi ora kaget tiap bulan. Kie lho mba, hitungane.”","20–30 dtk: “Komen KPR, tak kirim simulasi sesuai gajimu. Atau WA langsung ya.”"],cta:"Komen KPR",caption:"Mba, gaji 4 juta bisa KPR gak? Jawabane: bisa, asal disiapna sing bener. Nang Suvarna Village, angsuran FLAT 1 jutaan, DP 0%, rumah Type 36/60. Komen KPR, tak kirim simulasine. WA 0858-4266-2227.",tags:"#suvarnavillage #rumahsubsidipurwokerto #rumahmurahpurwokerto #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:2,funnel:"TOFU",segment:"KPR",hook:"“Katanya DP 0% itu bohong? Aku buktiin ya.”",footage:"Sofia di meja CS kantor pemasaran, buka brosur ke kamera. Tunjuk baris DP 0% dengan pulpen.",location:"Kantor Pemasaran — Meja CS",talent:"Sofia — hijab, baju maroon",props:"Brosur • Pulpen • HP",script:["0–3 dtk: “Katanya DP 0% itu bohong? Aku buktiin ya.”","3–10 dtk: “Aku wingi ditanya buyer, ‘Mba, mosok ora ana DP-e?’ Kie lho mba, tak tunjukna.”","10–20 dtk: Zoom brosur. “DP 0%, FREE BPHTB, GRATIS AJB. Dadi sing disiapna ya berkas, dudu DP gede.”","20–30 dtk: “Komen DP 0, tak kirim rincian biayane. Ben ora penasaran maning.”"],cta:"Komen DP 0",caption:"DP 0% itu bohong? Nang Suvarna Village, DP 0% + FREE BPHTB + GRATIS AJB. Sing penting berkas lengkap lan lolos verifikasi bank. Komen DP 0, tak kirim rinciane. WA 0858-4266-2227.",tags:"#suvarnavillage #rumahsubsidipurwokerto #dp0 #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:3,funnel:"TOFU",segment:"KPR",hook:"“Kalau BI Checking jelek, booking fee hangus gak mba?”",footage:"Sofia duduk di meja CS, HP di tangan. Tunjuk chat buyer yang khawatir, lalu tatap kamera tenang.",location:"Kantor Pemasaran — Meja CS",talent:"Sofia — hijab, baju maroon",props:"HP • Chat buyer • Brosur",script:["0–3 dtk: “Kalau BI Checking jelek, booking fee hangus gak mba?”","3–10 dtk: “Pertanyaan iki sing paling sering mlebu WA-ku. Wajar mba, duit kan ora golek nang wit.”","10–20 dtk: “Makane nang kene dicek dhisik: KTP lan BI Checking. Ben ngerti peluangmu sakdurunge booking.”","20–30 dtk: “Komen CEK, tak pandu cara cek-e sing aman. Ora usah wedi dhisik.”"],cta:"Komen CEK",caption:"Takut BI Checking? Nang Suvarna Village, dicek dhisik KTP + BI Checking, ben langkahmu ora nebak-nebak. Aja booking sakdurunge ngerti hasil cek-e. Komen CEK, tak pandu. WA 0858-4266-2227.",tags:"#suvarnavillage #kprsubsidi #bichecking #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:4,funnel:"TOFU",segment:"KPR",hook:"“Baru nikah, ngontrak terus apa beli rumah subsidi?”",footage:"Sofia di ruang tamu rumah contoh, duduk santai. Bandingkan dua angka di kertas: kontrakan vs angsuran.",location:"Rumah Contoh — Ruang Tamu",talent:"Sofia — hijab, baju maroon",props:"Kertas hitungan • Kalkulator",script:["0–3 dtk: “Baru nikah, ngontrak terus apa beli rumah subsidi?”","3–10 dtk: “Ngontrak 800 ribu setahun wis meh 10 juta. Tapi omahe tetep dudu dewek.”","10–20 dtk: Tunjuk kertas. “Nang kene angsuran 1 jutaan, tapi saben bulan nyicil aset dewek. Beda rasane mba.”","20–30 dtk: “Komen NIKAH, tak hitungna versi gaji kalian berdua.”"],cta:"Komen NIKAH",caption:"Baru nikah, isih ngontrak? Kontrakan 800 ribuan ilang saben bulan. Nang Suvarna Village, angsuran 1 jutaan flat, omahe dadi aset dewek. Komen NIKAH, tak hitungna. WA 0858-4266-2227.",tags:"#suvarnavillage #rumahpertama #rumahsubsidipurwokerto #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:5,funnel:"TOFU",segment:"Rumah Contoh",hook:"“Rumah subsidi itu jelek ya? Coba liat ini dulu.”",footage:"Sofia jalan pelan di depan rumah contoh American Classic. Tunjuk pilar, jendela, dan fasad dari jauh ke dekat.",location:"Depan Rumah Contoh Type 36/60",talent:"Sofia — hijab, baju maroon",props:"Kunci rumah • Brosur",script:["0–3 dtk: “Rumah subsidi itu jelek ya? Coba liat ini dulu.”","3–10 dtk: “Aku wingi ya mikir ngono. Nanging pas tekan kene, aku kaget dewek.”","10–20 dtk: Jalan ke fasad. “Kie lho mba, American Classic. Pilare, jendelane, atape — ora kaya rumah kotak biasa.”","20–30 dtk: “Komen LIHAT, tak kirim foto fasad + jadwal survey-e.”"],cta:"Komen LIHAT",caption:"Rumah subsidi = jelek? Coba deleng dhisik Suvarna Village Type 36/60 American Classic. Fasad rapi, ora kaya rumah kotak biasa. Komen LIHAT, tak kirim jadwal survey. WA 0858-4266-2227.",tags:"#suvarnavillage #americanclassic #rumahsubsidipurwokerto #rumahmurahpurwokerto #perumahansokaraja #infopurwokerto"},{day:6,funnel:"TOFU",segment:"KPR",hook:"“Anak muda Purwokerto gagal KPR gara-gara 5 hal ini.”",footage:"Sofia di depan Site Plan, hitung jari satu-satu. Setiap poin ditahan 1 detik, ekspresi serius tapi ramah.",location:"Depan Site Plan Batch I",talent:"Sofia — hijab, baju maroon",props:"Site Plan • HP",script:["0–3 dtk: “Anak muda Purwokerto gagal KPR gara-gara 5 hal ini.”","3–10 dtk: “Siji: telat bayar cicilan. Loro: pinjol numpuk. Telu: berkas ora lengkap.”","10–20 dtk: Lanjut hitung jari. “Papat: gaji ora kebukti. Lima: nebak-nebak, ora tau cek BI Checking.”","20–30 dtk: “Komen GAGAL, tak kirim checklist-e ben kowe ora kejebak.”"],cta:"Komen GAGAL",caption:"Gagal KPR sering dudu merga gaji cilik, tapi merga 5 hal iki: telat cicilan, pinjol numpuk, berkas ora lengkap, gaji ora kebukti, lan ora tau cek BI Checking. Komen GAGAL, tak kirim checklist-e. WA 0858-4266-2227.",tags:"#suvarnavillage #kprsubsidi #tipsKPR #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:7,funnel:"TOFU",segment:"KPR",hook:"“Mba, aku takut ditolak bank, dulu pernah pinjol.”",footage:"Sofia di dapur rumah contoh, gaya curhat pelan. Tunjuk HP, jelaskan cara cek BI Checking gratis tanpa menghakimi.",location:"Rumah Contoh — Dapur",talent:"Sofia — hijab, baju maroon",props:"HP • Gelas • Brosur",script:["0–3 dtk: “Mba, aku takut ditolak bank, dulu pernah pinjol.”","3–10 dtk: “Mba, jujur bae ya… akeh sing chat aku kaya kue. Kowe ora dewekan.”","10–20 dtk: Tunjuk HP. “Sing penting dicek dhisik BI Checking-e. Ben ngerti kudu beresna apa, dudu mung wedi.”","20–30 dtk: “Komen BERANI, tak pandu cek-e pelan-pelan. Ora usah isin.”"],cta:"Komen BERANI",caption:"Pernah pinjol, wedi ditolak bank? Langkah pertama dudu nyerah, tapi cek BI Checking. Nang Suvarna Village, tak pandu pelan-pelan. Komen BERANI, tak temani cek-e. WA 0858-4266-2227.",tags:"#suvarnavillage #kprsubsidi #bichecking #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:8,funnel:"TOFU",segment:"Lokasi",hook:"“Sokaraja jauh? Dari sini ke Purwokerto cuma segini lho.”",footage:"Sofia berdiri di jalan depan perumahan, tunjuk arah ke Purwokerto. Kamera ikut arah tangan, lalu kembali ke wajah.",location:"Jalan Depan Perumahan",talent:"Sofia — hijab, baju maroon",props:"HP • Peta / Site Plan kecil",script:["0–3 dtk: “Sokaraja jauh? Dari sini ke Purwokerto cuma segini lho.”","3–10 dtk: “Aku wingi ditanya, ‘Mba, adoh ya?’ Padahal kie lho mba, jalane penak.”","10–20 dtk: Tunjuk jalan. “Wiradadi, Sokaraja — akses-e gampang, ora kudu muter-muter kota.”","20–30 dtk: “Komen JALAN, tak kirim titik lokasine. Survey bareng yuk.”"],cta:"Komen JALAN",caption:"Sokaraja adoh? Wiradadi, Sokaraja itu akses-e gampang menyang Purwokerto. Mending survey langsung, ben ngerti rasane jalane. Komen JALAN, tak kirim lokasine. WA 0858-4266-2227.",tags:"#suvarnavillage #sokaraja #wiradadi #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:9,funnel:"TOFU",segment:"Rumah Contoh",hook:"“Type 36/60 itu kecil ya? Coba masuk, segini lho.”",footage:"Sofia masuk dari pintu depan, ukur lebar ruang pakai meteran. Kamera ikut dari pintu ke ruang tamu.",location:"Rumah Contoh — Pintu & Ruang Tamu",talent:"Sofia — hijab, baju maroon",props:"Meteran • Kunci rumah",script:["0–3 dtk: “Type 36/60 itu kecil ya? Coba masuk, segini lho.”","3–10 dtk: “Nang foto ketok cilik. Nanging mlebu kene, rasane beda.”","10–20 dtk: Tarik meteran. “Kie lho mba, ruang tamune segini. Isih muat sofa + meja.”","20–30 dtk: “Komen MASUK, tak kirim denah + jadwal lihat langsung.”"],cta:"Komen MASUK",caption:"Type 36/60 ketok cilik nang foto? Mlebu langsung ben ngerti. Ruang tamu, kamar, dapur — ditata ben nyaman kanggo keluarga muda. Komen MASUK, tak kirim denahe. WA 0858-4266-2227.",tags:"#suvarnavillage #type3660 #rumahsubsidipurwokerto #rumahmurahpurwokerto #perumahansokaraja #infopurwokerto"},{day:10,funnel:"TOFU",segment:"KPR",hook:"“Tetanggaku beli rumah subsidi, 3 tahun harganya naik berapa?”",footage:"Sofia di depan rumah yang sudah jadi, cerita pelan seperti gosip baik. Tunjuk deretan rumah dan jalan cor.",location:"Depan Rumah Jadi — Batch I",talent:"Sofia — hijab, baju maroon",props:"Site Plan • HP",script:["0–3 dtk: “Tetanggaku beli rumah subsidi, 3 tahun harganya naik berapa?”","3–10 dtk: “Aku wingi ngobrol karo buyer lawas. Jarene, nyesel kenapa ora tuku luwih gasik.”","10–20 dtk: Tunjuk lingkungan. “Lingkungane dadi, jalane dadi, omahe keisi. Rega ora nunggu kowe siap.”","20–30 dtk: “Komen NAIK, tak kirim pertimbangane ben kowe ora mung ikut-ikutan.”"],cta:"Komen NAIK",caption:"Rumah subsidi dudu mung panggon turu, tapi aset jangka panjang. Lingkungan dadi, akses dadi, nilai ikut jalan. Sing penting tuku sesuai kemampuan, ora maksakna. Komen NAIK, tak kirim pertimbangane. WA 0858-4266-2227.",tags:"#suvarnavillage #investasirumah #rumahsubsidipurwokerto #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:11,funnel:"TOFU",segment:"KPR",hook:"“Cara cek rumah subsidi beneran SHM pecah atau masih induk.”",footage:"Sofia di meja CS, tunjuk map dokumen. Bagian sensitif diburamkan. Fokus ke penjelasan, bukan angka dokumen.",location:"Kantor Pemasaran — Meja CS",talent:"Sofia — hijab, baju maroon",props:"Map dokumen • SHM (blur sensitif)",script:["0–3 dtk: “Cara cek rumah subsidi beneran SHM pecah atau masih induk.”","3–10 dtk: “Iki penting mba. Aja mung percaya omongan, takon dokumene.”","10–20 dtk: Tunjuk map. “Nang Suvarna Village, SHM wis pecah. Kie lho mba, tak tunjukna cara ngeceke.”","20–30 dtk: “Komen SHM, tak kirim daftar pertanyaan sing kudu ditakokna pas survey.”"],cta:"Komen SHM",caption:"SHM pecah vs SHM induk itu beda nasib. Nang Suvarna Village, SHM wis pecah — dadi status omahe jelas. Pas survey, takon dokumene, aja mung deleng fasade. Komen SHM, tak kirim daftar tanya. WA 0858-4266-2227.",tags:"#suvarnavillage #shmpecah #rumahsubsidipurwokerto #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:12,funnel:"TOFU",segment:"Rumah Contoh",hook:"“Listrik 1300 VA cukup gak buat AC + mesin cuci?”",footage:"Sofia di dapur, nyalakan lampu, tunjuk meteran listrik. Lalu hitung beban pakai jari, gaya santai.",location:"Rumah Contoh — Dapur & Meteran",talent:"Sofia — hijab, baju maroon",props:"Meteran listrik • HP",script:["0–3 dtk: “Listrik 1300 VA cukup gak buat AC + mesin cuci?”","3–10 dtk: “Pertanyaan iki mlebu terus. Wajar, sapa sing pengen jeglek terus?”","10–20 dtk: Tunjuk meteran. “Listrike 1300 VA. Asal gantian, AC + mesin cuci + kulkas isih aman.”","20–30 dtk: “Komen LISTRIK, tak kirim contoh pembagian bebane.”"],cta:"Komen LISTRIK",caption:"Listrik 1300 VA cukup gak? Nang Suvarna Village, listrik 1300 VA — cukup kanggo AC, mesin cuci, kulkas, asal ora bareng kabeh pas puncak. Komen LISTRIK, tak kirim contoh hitungane. WA 0858-4266-2227.",tags:"#suvarnavillage #rumahsubsidipurwokerto #type3660 #rumahmurahpurwokerto #perumahansokaraja #infopurwokerto"},{day:13,funnel:"TOFU",segment:"Rumah Contoh",hook:"“Beli rumah subsidi vs nunggu warisan, mana yang lebih cepet?”",footage:"Sofia di ruang tamu, cerita lucu sambil senyum. Kamera diam, fokus ke ekspresi dan punchline.",location:"Rumah Contoh — Ruang Tamu",talent:"Sofia — hijab, baju maroon",props:"Brosur • Kunci rumah",script:["0–3 dtk: “Beli rumah subsidi vs nunggu warisan, mana yang lebih cepet?”","3–10 dtk: “Warisan… ya nek ana. Nek ora ana? Mosok ngontrak nganti tuwa?”","10–20 dtk: “Nang kene, angsuran 1 jutaan, omahe langsung bisa ditempati. Ora usah nunggu giliran.”","20–30 dtk: “Komen WARISAN, tak kirim hitungan paling realistis kanggo kowe.”"],cta:"Komen WARISAN",caption:"Nunggu warisan vs nyicil rumah dewek? Warisan belum tentu ana, tapi kontrakan pasti jalan terus. Suvarna Village: angsuran 1 jutaan flat, rumah Type 36/60 langsung ditempati. Komen WARISAN, tak hitungna. WA 0858-4266-2227.",tags:"#suvarnavillage #rumahpertama #rumahsubsidipurwokerto #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:14,funnel:"TOFU",segment:"KPR",hook:"“Suami istri gaji gabungan 7 juta, bisa ambil yang mana?”",footage:"Sofia di meja CS, hitung kalkulator berdua gaya simulasi pasangan. Tulis angka di kertas, tunjuk ke kamera.",location:"Kantor Pemasaran — Meja CS",talent:"Sofia — hijab, baju maroon",props:"Kalkulator • Kertas • Pulpen",script:["0–3 dtk: “Suami istri gaji gabungan 7 juta, bisa ambil yang mana?”","3–10 dtk: “Kie lho mba, akeh pasangan muda sing gajine digabung. Malah luwih kuat.”","10–20 dtk: Hitung di kertas. “Gaji gabungan 7 juta, angsuran 1 jutaan — isih ana sisa kanggo urip.”","20–30 dtk: “Komen GABUNG, tak hitungna versi kalian berdua.”"],cta:"Komen GABUNG",caption:"Suami istri gaji gabungan 7 juta? Justru luwih kuat ngajukna KPR bareng. Nang Suvarna Village, angsuran 1 jutaan flat, ora nggerus kabeh gaji. Komen GABUNG, tak hitungna versi kalian. WA 0858-4266-2227.",tags:"#suvarnavillage #kprsubsidi #pasanganmuda #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:15,funnel:"TOFU",segment:"Testimoni",hook:"“Kenapa banyak yang booking di Suvarna Village? Aku tanya buyer-nya.”",footage:"Sofia wawancara buyer real di depan rumah contoh. Buyer pegang brosur, Sofia pegang HP sebagai mic darurat.",location:"Depan Rumah Contoh",talent:"Sofia + Buyer real",props:"HP • Brosur",script:["0–3 dtk: “Kenapa banyak yang booking di Suvarna Village? Aku tanya buyer-nya.”","3–10 dtk: “Mba, jujur bae ya… kenapa milih kene?” Buyer jawab singkat, natural.","10–20 dtk: Buyer tunjuk lokasi / rumah. Sofia angguk, ulangi poin paling kuat dengan bahasa sendiri.","20–30 dtk: “Komen ALASAN, tak kirim cerita lengkap buyer-e. Kowe bisa dadi sing sabanjure.”"],cta:"Komen ALASAN",caption:"Kenapa akeh sing booking nang Suvarna Village? Takon langsung karo buyer-e, dudu mung kataku. Lokasi Wiradadi, Sokaraja, angsuran 1 jutaan, DP 0%. Komen ALASAN, tak kirim ceritane. WA 0858-4266-2227.",tags:"#suvarnavillage #testimoni #rumahsubsidipurwokerto #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:16,funnel:"TOFU",segment:"Testimoni",hook:"“Cohir Booking Rumah Subsidi part 2 — Cek KTP, Cek Lokasi, Sudah Booking.”",footage:"Split screen joget ala konten viral sebelumnya. Kiri-kanan Sofia, teks besar tiap langkah. Energi ceria, tetap sopan.",location:"Depan Rumah Contoh + Meja CS",talent:"Sofia — hijab, baju maroon",props:"HP • Site Plan • KTP (contoh / blur)",script:["0–3 dtk: Musik naik. Teks: “Cohir Booking Rumah Subsidi Part 2.”","3–10 dtk: Joget + teks: “Cek KTP.” Sofia tunjuk KTP contoh, lalu joget lagi.","10–20 dtk: “Cek Lokasi.” Sofia tunjuk Site Plan + jalan. “Sudah Booking.” Sofia tunjuk kunci.","20–30 dtk: Freeze + CTA: “Komen COHIR, tak kirim langkah booking-e.”"],cta:"Komen COHIR",caption:"Cohir Booking Rumah Subsidi Part 2: Cek KTP, Cek Lokasi, Sudah Booking. Sing viral wingi, saiki versi Suvarna Village. Komen COHIR, tak kirim langkah booking-e. WA 0858-4266-2227.",tags:"#suvarnavillage #cohirbooking #rumahsubsidipurwokerto #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:17,funnel:"TOFU",segment:"Rumah Contoh",hook:"“Air di Wiradadi bagus gak? Aku cek torennya ya.”",footage:"Sofia di area toren / dapur rumah contoh, tuang air ke botol bening. Close-up air, lalu wajah lega.",location:"Rumah Contoh — Area Air / Dapur",talent:"Sofia — hijab, baju maroon",props:"Botol bening • Ember kecil",script:["0–3 dtk: “Air di Wiradadi bagus gak? Aku cek torennya ya.”","3–10 dtk: “Iki sing sering ditakokna ibu-ibu. Banyu kan kanggo masak, adus, ngombe.”","10–20 dtk: Tuang ke botol. “Kie lho mba, tak tuang nang botol bening. Delengen dewek.”","20–30 dtk: “Komen AIR, tak kirim video cek lengkap + jadwal survey-e.”"],cta:"Komen AIR",caption:"Air nang Wiradadi piye? Tak cek langsung nang toren rumah contoh, dituang nang botol bening ben ketok. Survey langsung luwih manteb tinimbang mung takon. Komen AIR, tak kirim jadwal. WA 0858-4266-2227.",tags:"#suvarnavillage #wiradadi #rumahsubsidipurwokerto #rumahmurahpurwokerto #perumahansokaraja #infopurwokerto"},{day:18,funnel:"TOFU",segment:"Lokasi",hook:"“Jalan ke perumahan becek gak kalau hujan? Aku spill pas hujan.”",footage:"Sofia jalan di jalan cor perumahan saat hujan ringan / setelah hujan. Tunjuk drainase dan jalan yang tidak tergenang.",location:"Jalan Cor Perumahan",talent:"Sofia — hijab, baju maroon",props:"Payung / Jas hujan • HP",script:["0–3 dtk: “Jalan ke perumahan becek gak kalau hujan? Aku spill pas hujan.”","3–10 dtk: “Aku wingi ditanya, ‘Mba, nek udan piye?’ Ya wis, tak video pas udan tenan.”","10–20 dtk: Jalan + tunjuk drainase. “Kie lho mba, jalane cor, drainasene jalan. Ora becek kaya sing dibayangna.”","20–30 dtk: “Komen HUJAN, tak kirim video pas udan + titik lokasine.”"],cta:"Komen HUJAN",caption:"Jalan becek pas udan? Tak spill pas udan tenan: jalan cor, drainase jalan. Mending deleng dewek pas survey, ben ora mung katanya. Komen HUJAN, tak kirim videone. WA 0858-4266-2227.",tags:"#suvarnavillage #sokaraja #wiradadi #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:19,funnel:"MOFU",segment:"Rumah Contoh",hook:"“Bedanya Type 36/60 Suvarna sama subsidi lain di Sokaraja, aku jejerin ya.”",footage:"Sofia di depan Site Plan, jejerkan dua kolom spek di kertas. Tunjuk satu-satu, tanpa menyebut nama kompetitor.",location:"Depan Site Plan Batch I",talent:"Sofia — hijab, baju maroon",props:"Kertas perbandingan • Site Plan",script:["0–3 dtk: “Bedanya Type 36/60 Suvarna sama subsidi lain di Sokaraja, aku jejerin ya.”","3–10 dtk: “Ben kowe ora mung bandingna rega. Spek-e ya kudu dijejer.”","10–20 dtk: Tunjuk kertas. “Fasad American Classic, SHM pecah, listrik 1300 VA, FREE BPHTB + GRATIS AJB.”","20–30 dtk: “Komen BANDING, tak kirim tabel perbandingane sing jujur.”"],cta:"Komen BANDING",caption:"Bandingna rumah subsidi aja mung regane. Jejerna speke: fasad, SHM, listrik, biaya tambahan. Suvarna Village Type 36/60 American Classic, SHM pecah, listrik 1300 VA. Komen BANDING, tak kirim tabele. WA 0858-4266-2227.",tags:"#suvarnavillage #rumahsubsidipurwokerto #type3660 #kprsubsidi #perumahansokaraja #infopurwokerto"},{day:20,funnel:"MOFU",segment:"KPR",hook:"“Simulasi KPR 1 juta flat itu gimana hitungnya? Aku coret-coret ya.”",footage:"Sofia di meja CS, coret-coret kertas simulasi. Kamera atas meja, tangan menulis angka besar.",location:"Kantor Pemasaran — Meja CS",talent:"Sofia — hijab, baju maroon",props:"Kertas • Kalkulator • Pulpen",script:["0–3 dtk: “Simulasi KPR 1 juta flat itu gimana hitungnya? Aku coret-coret ya.”","3–10 dtk: “Harga 166 juta. Angsuran flat 1 jutaan. Dadi saben bulan ora kaget.”","10–20 dtk: Coret kertas. “Kie lho mba, tak tulis pelan-pelan. Tenor + angsuran + sisa biaya.”","20–30 dtk: “Komen HITUNG, tak kirim simulasi sesuai gaji + tenormu.”"],cta:"Komen HITUNG",caption:"Simulasi KPR 1 juta flat piye hitunge? Harga 166 juta, angsuran FLAT 1 jutaan, DP 0%. Tak coret-coret ben jelas. Komen HITUNG, tak kirim simulasi sesuai gajimu. WA 0858-4266-2227.",tags:"#suvarnavillage #simulasiKPR #kprsubsidi #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:21,funnel:"MOFU",segment:"Rumah Contoh",hook:"“Tour rumah contoh Type 36/60 — kamar mandi segini, dapur segini.”",footage:"Sofia tour satu alur: pintu → ruang tamu → kamar 1 → kamar 2 → kamar mandi → dapur → carport. Satu take per ruang.",location:"Dalam Rumah Contoh",talent:"Sofia — hijab, baju maroon",props:"Meteran • Kunci rumah",script:["0–3 dtk: “Tour rumah contoh Type 36/60 — kamar mandi segini, dapur segini.”","3–10 dtk: Masuk + ruang tamu. “Kie ruang tamune. Lanjut kamar siji.”","10–20 dtk: Kamar 2, kamar mandi, dapur. “Kamar mandine segini, dapure segini. Carporte nang ngarep.”","20–30 dtk: “Komen TOUR, tak kirim denah + jadwal tour langsung.”"],cta:"Komen TOUR",caption:"Tour Type 36/60: 2 kamar, kamar mandi, dapur, ruang tamu, carport. Foto ora cukup — mlebu langsung ben ngerti rasane. Komen TOUR, tak kirim denah + jadwal. WA 0858-4266-2227.",tags:"#suvarnavillage #tourrumah #type3660 #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:22,funnel:"MOFU",segment:"KPR",hook:"“Unboxing kunci rumah + dokumen yang didapet buyer.”",footage:"Sofia di meja CS, buka map dokumen satu-satu. Kunci diletakkan di atas map, close-up di akhir.",location:"Kantor Pemasaran — Meja CS",talent:"Sofia — hijab, baju maroon",props:"Map dokumen • Kunci • SHM / AJB (contoh, blur)",script:["0–3 dtk: “Unboxing kunci rumah + dokumen yang didapet buyer.”","3–10 dtk: “Iki sing paling deg-degan: pas buyer nampa kunci + dokumen.”","10–20 dtk: Buka map. “SHM pecah, AJB, dokumen pendukung. Kabeh dijelasna siji-siji.”","20–30 dtk: “Komen DOKUMEN, tak kirim daftar dokumen sing bakal kowe terima.”"],cta:"Komen DOKUMEN",caption:"Unboxing kunci + dokumen buyer Suvarna Village: SHM pecah, AJB GRATIS, dokumen pendukung. Kabeh dijelasna, ora mung diserahna. Komen DOKUMEN, tak kirim daftare. WA 0858-4266-2227.",tags:"#suvarnavillage #shmpecah #kprsubsidi #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:23,funnel:"MOFU",segment:"Lokasi",hook:"“Progres pembangunan Batch I udah sampai mana? Aku keliling ya.”",footage:"Sofia pakai helm proyek putih, keliling lahan. Tunjuk fondasi / struktur, jalan, dan rumah yang sudah naik.",location:"Lahan Pembangunan Batch I",talent:"Sofia — helm proyek putih",props:"Helm proyek • Site Plan • HP",script:["0–3 dtk: “Progres pembangunan Batch I udah sampai mana? Aku keliling ya.”","3–10 dtk: “Ben kowe ora mung deleng brosur. Tak jak keliling langsung.”","10–20 dtk: Tunjuk fondasi / rumah. “Kie lho mba, sing wis dadi segini. Sing lagi dibangun segini.”","20–30 dtk: “Komen PROGRES, tak kirim update terbaru + jadwal survey.”"],cta:"Komen PROGRES",caption:"Progres Batch I wis tekan ndi? Tak kelilingna langsung: fondasi, struktur, rumah sing wis dadi. Update-e tak kirim saben ana perkembangan. Komen PROGRES, tak kirim update-e. WA 0858-4266-2227.",tags:"#suvarnavillage #progrespembangunan #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:24,funnel:"MOFU",segment:"Rumah Contoh",hook:"“American Classic itu kayak gimana? Bukan rumah kotak biasa lho.”",footage:"Sofia di depan fasad, tunjuk detail satu-satu: pilar, jendela, atap, garis fasad. Kamera naik-turun pelan.",location:"Depan Rumah Contoh",talent:"Sofia — hijab, baju maroon",props:"Brosur • Kunci rumah",script:["0–3 dtk: “American Classic itu kayak gimana? Bukan rumah kotak biasa lho.”","3–10 dtk: “Akeh sing ngira subsidi kudu kotak. Kie beda.”","10–20 dtk: Tunjuk detail. “Pilare, jendelane, atape. Ketok rapi, ketok klasik, ora norak.”","20–30 dtk: “Komen KLASIK, tak kirim foto detail fasad-e.”"],cta:"Komen KLASIK",caption:"American Classic dudu mung jeneng. Pilar, jendela, atap, lan garis fasad-e dibikin rapi — dudu rumah kotak biasa. Deleng langsung luwih ketok. Komen KLASIK, tak kirim foto detail-e. WA 0858-4266-2227.",tags:"#suvarnavillage #americanclassic #rumahsubsidipurwokerto #rumahmurahpurwokerto #perumahansokaraja #infopurwokerto"},{day:25,funnel:"MOFU",segment:"KPR",hook:"“Biaya tambahan apa aja selain 166 juta? Aku jujur-jujuran ya.”",footage:"Sofia di meja CS, tulis list biaya di kertas. Coret biaya yang FREE / GRATIS, lalu tunjuk total akhir.",location:"Kantor Pemasaran — Meja CS",talent:"Sofia — hijab, baju maroon",props:"Kertas • Pulpen • Kalkulator",script:["0–3 dtk: “Biaya tambahan apa aja selain 166 juta? Aku jujur-jujuran ya.”","3–10 dtk: “Iki sing paling kudu transparan. Aja nganti kaget nang tengah dalan.”","10–20 dtk: Tulis list. “BPHTB? FREE. AJB? GRATIS. Dadi sing 166 juta ya kuwe.”","20–30 dtk: “Komen BIAYA, tak kirim rincian lengkap + sing kudu disiapna.”"],cta:"Komen BIAYA",caption:"Biaya tambahan selain 166 juta? Tak jujur-jujuran: BPHTB FREE, AJB GRATIS. Sing penting takon rincian nganti jelas sakdurunge booking. Komen BIAYA, tak kirim rinciane. WA 0858-4266-2227.",tags:"#suvarnavillage #kprsubsidi #biayaKPR #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:26,funnel:"MOFU",segment:"KPR",hook:"“Cara booking cuma 3 langkah, aku praktekin.”",footage:"Sofia praktek di meja CS + Site Plan. Langkah 1 tunjuk KTP, langkah 2 tunjuk kavling, langkah 3 pegang brosur booking.",location:"Meja CS + Depan Site Plan",talent:"Sofia — hijab, baju maroon",props:"KTP (contoh) • Site Plan • Brosur",script:["0–3 dtk: “Cara booking cuma 3 langkah, aku praktekin.”","3–10 dtk: “Siji: Cek KTP + BI Checking. Ben ngerti peluangmu.”","10–20 dtk: “Loro: Pilih kavling nang Site Plan. Telu: Booking. Wis, semono tok.”","20–30 dtk: “Komen BOOKING, tak pandu langkah siji kanthi siji.”"],cta:"Komen BOOKING",caption:"Cara booking mung 3 langkah: 1. Cek KTP + BI Checking, 2. Pilih kavling nang Site Plan, 3. Booking. Ora ribet, ora kudu nebak-nebak. Komen BOOKING, tak pandu. WA 0858-4266-2227.",tags:"#suvarnavillage #carabooking #kprsubsidi #rumahsubsidipurwokerto #perumahansokaraja #infopurwokerto"},{day:27,funnel:"MOFU",segment:"Lokasi",hook:"“WA ku numpuk, isinya nanya ‘Mba, kavling pojok masih ada gak?’”",footage:"Sofia tunjuk HP dengan banyak chat, lalu lari ke Site Plan dan tunjuk kavling pojok yang masih tersedia / sudah terisi.",location:"Meja CS + Depan Site Plan",talent:"Sofia — hijab, baju maroon",
